name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    # Pinned: newer runner images dropped Python 3.9, which the Mac's system Python still is.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
